[tool.poetry]
name = "fast-zero"
version = "0.1.0"
description = "Minha API topada de massa"
authors = ["Rodrigo "]
readme = "README.md"
packages = [{include = "fast_zero", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = {extras = ["standard"], version = "^0.115.0"}
email-validator = "^2.2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.1"}
alembic = "^1.20.0"
pydantic-settings = "^2.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
poethepoet = "^0.29.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Configurações do Linter/Formatter (Ruff)

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
quote-style = 'single'

# Configurações de Testes (Pytest)

[tool.pytest.ini_options]
pythonpath = "src"
addopts = '-p no:warnings'

[tool.poe.tasks]
lint = 'ruff check .'
pre_format = 'ruff check --fix .'
format = 'ruff format .'
run = 'fastapi dev src/fast_zero/app.py'
pre_test = 'poe lint'
test = 'pytest -s -x --cov=fast_zero -vv'
post_test = 'coverage html'
